name: branding
on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        default: branding-001
      gemini_model:
        description: Optional existing eligible free model override
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: free-provider-account
  cancel-in-progress: false
jobs:
  branding:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTO_PUBLISH: 'false'
      FREE_ONLY: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      MAX_PAID_COST_USD: '0'
      AI_VIDEO_ENABLED: 'false'
      FREE_QUOTA_LEDGER_PATH: .cache/quota/free-quota-ledger.json
      CHROME_EXECUTABLE: /usr/bin/google-chrome
      RUN_ID: ${{ inputs.run_id || 'branding-001' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ inputs.gemini_model || vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
      GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || 'true' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_FREE_PLAN_CONFIRMED: ${{ vars.CLOUDFLARE_FREE_PLAN_CONFIRMED || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python scripts/restore-free-quota.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install media tools
        timeout-minutes: 7
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo timeout 120s apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
            sudo timeout 240s apt-get install --no-install-recommends -y ffmpeg
          fi
      - run: npm run lint && npm run typecheck && npm test
      - name: Channel logo and banner in the locked illustrated style; no upload
        run: npm run branding -- --run-id "$RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branding-${{ env.RUN_ID }}
          path: |
            data/runs/${{ env.RUN_ID }}/logo.png
            data/runs/${{ env.RUN_ID }}/banner.png
            data/runs/${{ env.RUN_ID }}/branding-summary.json
            data/runs/${{ env.RUN_ID }}/channel-profile.json
            data/runs/${{ env.RUN_ID }}/sources/*.png
            data/runs/${{ env.RUN_ID }}/*.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-quota-ledger
          path: .cache/quota/free-quota-ledger.json
          include-hidden-files: true
          retention-days: 30
