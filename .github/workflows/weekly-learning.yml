name: weekly-learning
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Actions run ID containing an analytics artifact (optional with Supabase)
        type: string
permissions:
  contents: read
  actions: read
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        if: inputs.source_run_id != ''
        with:
          name: analytics
          path: data/analytics
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - run: npm run learn
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-recommendations
          path: data/analytics/recommendations.json
          retention-days: 90
