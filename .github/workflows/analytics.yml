name: analytics
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Logical video run ID from create-video
        type: string
        required: true
      source_run_id:
        description: GitHub Actions ID of the create-video or previous private-upload run
        type: string
        required: true

permissions:
  contents: read
  actions: read
concurrency:
  group: analytics-${{ inputs.run_id || github.run_id }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTO_PUBLISH: 'false'
      RUN_ID: ${{ inputs.run_id || github.run_id }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-${{ env.RUN_ID }}
          path: data/runs
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - run: npm run analytics -- --run-id "$RUN_ID"
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: analytics
          path: data/analytics/*.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-${{ env.RUN_ID }}
          path: data/runs/
          retention-days: 30
          if-no-files-found: warn
