name: resume-approved-episode
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dispatch_ready:
        description: Resume the owner-authorized queue without daily or attempt-count limits
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: approved-episode-resume
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: youtube-private
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Continue the monthly queue without per-cycle approval; preserve budget and QA gates
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISPATCH_READY: ${{ github.event_name == 'schedule' && 'true' || inputs.dispatch_ready }}
        run: npx tsx scripts/monthly-production.ts
