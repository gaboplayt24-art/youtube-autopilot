name: research
on:
  workflow_dispatch:
    inputs:
      gemini_free_tier_confirmed:
        description: Production only; eligible Gemini Free Tier project without paid API billing
        type: boolean
        default: false
      retry_from:
        description: Optional stage to regenerate
        type: string
      mode:
        type: choice
        options: [demo, production]
        default: demo
      topic:
        type: string
        default: How automated video production works
      run_id:
        description: Logical run ID; leave empty for a unique GitHub run ID
        type: string
      source_run_id:
        description: GitHub Actions run number ID containing the previous pipeline artifact
        type: string

permissions:
  contents: write
  actions: read
concurrency:
  group: free-provider-account
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTO_PUBLISH: 'false'
      FREE_ONLY: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      MAX_PAID_COST_USD: '0'
      FREE_QUOTA_LEDGER_PATH: .cache/quota/free-quota-ledger.json
      RUN_ID: ${{ inputs.run_id || github.run_id }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      MODE: ${{ inputs.mode || 'demo' }}
      TOPIC: ${{ inputs.topic }}
      RETRY_FROM: ${{ inputs.retry_from }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 scripts/restore-free-quota.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.source_run_id != ''
        with:
          name: pipeline-${{ env.RUN_ID }}
          path: data/runs
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run lint && npm run typecheck && npm test
      - run: |
          args=(--run-id "$RUN_ID" --mode "$MODE" --topic "$TOPIC")
          if [ -n "$RETRY_FROM" ]; then args+=(--retry-from "$RETRY_FROM"); fi
          npm run research -- "${args[@]}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || (inputs.gemini_free_tier_confirmed && 'true' || '') }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-${{ env.RUN_ID }}
          path: data/runs/
          retention-days: 30
          if-no-files-found: warn
      - name: Persist shared quota in private repository release
        if: always()
        run: |
          if [ -f scripts/github_checkpoints.py ]; then python3 scripts/github_checkpoints.py save-quota; fi
        env:
          GH_TOKEN: ${{ github.token }}
