name: voice-audition-free
on:
  workflow_dispatch:
    inputs:
      cloudflare_free_plan_confirmed:
        description: Account is on Workers Free, without paid overage billing (optional MeloTTS C)
        type: boolean
        default: false
      run_id:
        type: string
        default: voice-audition-free
      source_run_id:
        description: Resume raw voices from this Actions run without synthesis charges/work
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: free-provider-account
  cancel-in-progress: false
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AUTO_PUBLISH: 'false'
      FREE_ONLY: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      MAX_PAID_COST_USD: '0'
      AI_VIDEO_ENABLED: 'false'
      MODEL_CACHE_DIR: ${{ github.workspace }}/.cache/models
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
      QWEN_PYTHON: ${{ github.workspace }}/.venv-qwen/bin/python
      FREE_QUOTA_LEDGER_PATH: .cache/quota/free-quota-ledger.json
      RUN_ID: ${{ inputs.run_id || github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        id: models
        with:
          path: |
            .cache/models
            .cache/huggingface
          key: cpu-models-nano71ccd-depth5426-kokoro82-whispersmall-v3
          restore-keys: cpu-models-nano71ccd-depth5426-kokoro82-whispertiny-v1
      - uses: actions/cache@v4
        id: python-env
        with:
          path: |
            .venv-ai
            .cache/pip
          key: cpu-ai-ubuntu-${{ steps.python.outputs.python-version }}-${{ hashFiles('scripts/setup-cpu-ai.sh', 'scripts/requirements-cpu-ai.lock') }}
      - uses: actions/cache@v4
        id: qwen-env
        with:
          path: |
            .venv-qwen
            .cache/qwen-environment.txt
          key: qwen-cpu-${{ steps.python.outputs.python-version }}-${{ hashFiles('scripts/setup-qwen.sh', 'scripts/requirements-qwen.txt') }}
      - run: npm ci
      - name: Install optional Qwen CPU environment
        if: steps.qwen-env.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: bash scripts/setup-qwen.sh
      - name: Install audio tools
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo timeout 120s apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
            sudo timeout 120s apt-get install --no-install-recommends -y ffmpeg
          fi
      - name: Install CPU models environment
        if: steps.python-env.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: bash scripts/setup-cpu-ai.sh
      - run: python scripts/restore-free-quota.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.source_run_id != ''
        with:
          name: voice-audition-free-${{ env.RUN_ID }}
          path: data/runs/${{ env.RUN_ID }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - run: ffmpeg -version && ffprobe -version
      - run: npm run lint && npm run typecheck && npm test
      - name: A Nano, B Kokoro, optional C Qwen CPU, D MeloTTS; manual selection
        timeout-minutes: 40
        run: npm run voice-audition-free -- --run-id "$RUN_ID"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_FREE_PLAN_CONFIRMED: ${{ vars.CLOUDFLARE_FREE_PLAN_CONFIRMED || (inputs.cloudflare_free_plan_confirmed && 'true' || '') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-audition-free-${{ env.RUN_ID }}
          path: data/runs/${{ env.RUN_ID }}/
          retention-days: 30
      - name: Persist shared quota in private repository release
        if: always()
        run: |
          if [ -f scripts/github_checkpoints.py ]; then python3 scripts/github_checkpoints.py save-quota; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain downloaded public models after a failed quality gate
        if: always() && !cancelled() && steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/models
            .cache/huggingface
          key: cpu-models-nano71ccd-depth5426-kokoro82-whispersmall-v3
