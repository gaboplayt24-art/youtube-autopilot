name: visual-evidence-review
on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        required: true
        default: bible-angels-001
      source_run_id:
        type: string
        required: true
      gemini_model:
        type: string
        default: gemini-3.1-flash-lite
permissions:
  contents: write
  actions: read
concurrency:
  group: free-provider-account
  cancel-in-progress: false
jobs:
  review-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ inputs.gemini_model }}
      GEMINI_FREE_TIER_CONFIRMED: 'true'
      FREE_QUOTA_LEDGER_PATH: .cache/quota/free-quota-ledger.json
      AUTO_PUBLISH: 'false'
      FREE_ONLY: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      MAX_PAID_COST_USD: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Media tools
        timeout-minutes: 7
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo timeout 120s apt-get update -o Acquire::Retries=1
            sudo timeout 240s apt-get install --no-install-recommends -y ffmpeg
          fi
      - run: npm run lint && npm run typecheck && npm test
      - name: Require private repository before reading or uploading images
        run: python3 -c "import os,runpy; runpy.run_path('scripts/github_checkpoints.py')['require_private'](os.environ['GITHUB_REPOSITORY'])"
      - run: python3 scripts/restore-free-quota.py
      - run: python3 scripts/github_checkpoints.py restore
      - name: Real Gemini review of existing images; no Cloudflare secret or generator
        timeout-minutes: 45
        run: npx tsx src/visuals/review-existing.ts
      - name: Preserve original sources and separate review checkpoints
        if: always()
        run: python3 scripts/github_checkpoints.py save
      - name: Preserve shared quota
        if: always()
        run: python3 scripts/github_checkpoints.py save-quota
      - name: Export review evidence to the private release
        if: always()
        run: |
          if [ -f "data/runs/$RUN_ID/visual-evidence-review.json" ]; then
            cp "data/runs/$RUN_ID/visual-evidence-review.json" "visual-evidence-$GITHUB_RUN_ID.json"
            gh release upload "pipeline-checkpoint-$RUN_ID" "visual-evidence-$GITHUB_RUN_ID.json" --repo "$GITHUB_REPOSITORY"
            echo "Existing images reviewed. No images generated, no production video approved, no YouTube upload." >> "$GITHUB_STEP_SUMMARY"
          fi
