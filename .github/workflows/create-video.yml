name: create-video
on:
  workflow_dispatch:
    inputs:
      retry_from:
        description: Optional stage to regenerate (invalidates that stage and downstream outputs)
        type: string
      mode:
        type: choice
        options: [demo, production]
        default: demo
      production_kind:
        description: Quality test 8-12 min or benchmark long-form (no automatic production runs)
        type: choice
        options: [quality_test, longform]
        default: quality_test
      topic:
        type: string
        default: How automated video production works
      run_id:
        description: Logical run ID; leave empty for a unique GitHub run ID
        type: string
      source_run_id:
        description: GitHub Actions run number ID containing the previous pipeline artifact
        type: string

permissions:
  contents: read
  actions: read
concurrency:
  group: create-video-${{ inputs.run_id || github.run_id }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.mode == 'production' && 120 || 25 }}
    env:
      AUTO_PUBLISH: 'false'
      MODEL_CACHE_DIR: ${{ github.workspace }}/.cache/models
      PRODUCTION_KIND: ${{ inputs.production_kind || 'quality_test' }}
      RUN_ID: ${{ inputs.run_id || github.run_id }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      MODE: ${{ inputs.mode || 'demo' }}
      TOPIC: ${{ inputs.topic }}
      RETRY_FROM: ${{ inputs.retry_from }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache/models
          key: local-speech-linux-kokoro82-v1-q8-whisper-tiny-en-transformers381-v2
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/remotion
          key: remotion-linux-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - uses: actions/download-artifact@v4
        if: inputs.source_run_id != ''
        with:
          name: pipeline-${{ env.RUN_ID }}
          path: data/runs
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Ensure FFmpeg without refreshing installed dependencies
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo timeout 120s apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
            sudo timeout 120s apt-get install --no-install-recommends -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - run: npm run lint && npm run typecheck && npm test
      - name: Obtain benchmark for long-form only
        if: inputs.mode == 'production' && inputs.production_kind == 'longform'
        run: npm run benchmark
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          BENCHMARK_CHANNEL: ${{ vars.BENCHMARK_CHANNEL || '@ancientlivesHQ' }}
      - name: Verify CI browser
        run: /usr/bin/google-chrome --version
      - name: Generate complete video without upload
        timeout-minutes: ${{ inputs.mode == 'production' && 100 || 18 }}
        run: |
          args=(--run-id "$RUN_ID" --mode "$MODE" --topic "$TOPIC" --production-kind "$PRODUCTION_KIND")
          if [ -n "$RETRY_FROM" ]; then args+=(--retry-from "$RETRY_FROM"); fi
          npm run video -- "${args[@]}"
        env:
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          STOCK_PROVIDER: ${{ vars.STOCK_PROVIDER }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'auto' }}
          KOKORO_VOICE: ${{ vars.KOKORO_VOICE }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL || 'eleven_v4' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
          TARGET_DURATION_MODE: ${{ vars.TARGET_DURATION_MODE || 'benchmark_median' }}
          QUALITY_FLOOR: ${{ vars.QUALITY_FLOOR || '80' }}
          MAX_GENERATED_IMAGES_PER_VIDEO: ${{ vars.MAX_GENERATED_IMAGES_PER_VIDEO || '8' }}
          AI_VIDEO_ENABLED: 'false'
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHROME_EXECUTABLE: /usr/bin/google-chrome
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-${{ env.RUN_ID }}
          path: data/runs/
          retention-days: 30
          if-no-files-found: warn
