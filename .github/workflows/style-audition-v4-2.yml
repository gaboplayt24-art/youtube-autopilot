name: style-audition-v4-2
on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        default: style-v4-2-real-001
        description: Fresh native four-source audition and packaging benchmark ID
      source_run_id:
        type: string
        description: Optional previous native milestone containing checkpoints
permissions:
  contents: write
  actions: read
concurrency:
  group: free-provider-account
  cancel-in-progress: false
jobs:
  milestone:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN_ID: ${{ inputs.run_id }}
      FREE_ONLY: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      MAX_PAID_COST_USD: '0'
      AUTO_PUBLISH: 'false'
      FREE_QUOTA_LEDGER_PATH: .cache/quota/free-quota-ledger.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 scripts/restore-free-quota.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.source_run_id != ''
        with:
          name: native-packaging-${{ env.RUN_ID }}
          path: data/runs/${{ env.RUN_ID }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - run: bash scripts/ensure-media-ci.sh
        timeout-minutes: 5
      - run: npm run lint && npm run typecheck && npm test
      - name: Public performance and original packaging benchmark
        id: benchmark
        continue-on-error: true
        timeout-minutes: 12
        run: npx tsx src/visuals/audition-v4-2.ts --run-id "$RUN_ID" --stage benchmark
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || 'true' }}
      - name: Four new native 16:9 Klein sources only
        id: style
        continue-on-error: true
        timeout-minutes: 25
        run: npx tsx src/visuals/audition-v4-2.ts --run-id "$RUN_ID" --stage style
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || 'true' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_FREE_PLAN_CONFIRMED: ${{ vars.CLOUDFLARE_FREE_PLAN_CONFIRMED || 'true' }}
      - name: Preserve all real evidence, including rejection reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-packaging-${{ env.RUN_ID }}
          path: data/runs/${{ env.RUN_ID }}/
          retention-days: 30
      - name: Persist shared quota in private repository release
        if: always()
        run: |
          if [ -f scripts/github_checkpoints.py ]; then python3 scripts/github_checkpoints.py save-quota; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Fail if either required milestone failed
        if: always()
        env:
          BENCHMARK_RESULT: ${{ steps.benchmark.outcome }}
          STYLE_RESULT: ${{ steps.style.outcome }}
        run: test "$BENCHMARK_RESULT" = success && test "$STYLE_RESULT" = success
