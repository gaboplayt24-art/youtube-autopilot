name: style-packaging-v4-3
on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        default: style-v4-3-real-001
        description: Reuse originals, one selective repair, and independent packaging benchmarks
      source_run_id:
        type: string
        description: Prior approved native source artifact run
        default: '37746244518'
      resume_run_id:
        type: string
        description: Optional prior v4.3 execution with this same run ID; restores checkpoints without repeating returned inference
permissions:
  contents: read
  actions: read
concurrency:
  group: free-provider-account
  cancel-in-progress: false
jobs:
  milestone:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN_ID: ${{ inputs.run_id }}
      FREE_ONLY: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      MAX_PAID_COST_USD: '0'
      AUTO_PUBLISH: 'false'
      FREE_QUOTA_LEDGER_PATH: .cache/quota/free-quota-ledger.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 scripts/restore-free-quota.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: native-packaging-style-v4-2-real-001-review
          path: data/runs/${{ env.RUN_ID }}/prior
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.resume_run_id != ''
        with:
          name: native-packaging-${{ env.RUN_ID }}
          path: data/runs/${{ env.RUN_ID }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - run: bash scripts/ensure-media-ci.sh
        timeout-minutes: 5
      - run: npm run lint && npm run typecheck && npm test
      - name: Reassess 01, selectively repair 02, keep 03 and 04
        id: style
        continue-on-error: true
        timeout-minutes: 18
        run: npx tsx src/visuals/audition-v4-3.ts --run-id "$RUN_ID" --stage style --prior "data/runs/$RUN_ID/prior"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || 'true' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_FREE_PLAN_CONFIRMED: ${{ vars.CLOUDFLARE_FREE_PLAN_CONFIRMED || 'true' }}
      - name: Targeted public benchmark only, no FLUX credentials
        id: benchmark
        continue-on-error: true
        timeout-minutes: 22
        run: npx tsx src/visuals/audition-v4-3.ts --run-id "$RUN_ID" --stage benchmark --prior "data/runs/$RUN_ID/prior"
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || 'true' }}
      - name: Preserve all real evidence, including rejection reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-packaging-${{ env.RUN_ID }}
          path: data/runs/${{ env.RUN_ID }}/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-quota-ledger
          path: .cache/quota/free-quota-ledger.json
          include-hidden-files: true
      - name: Fail if either required milestone failed
        if: always()
        env:
          BENCHMARK_RESULT: ${{ steps.benchmark.outcome }}
          STYLE_RESULT: ${{ steps.style.outcome }}
        run: test "$BENCHMARK_RESULT" = success && test "$STYLE_RESULT" = success
