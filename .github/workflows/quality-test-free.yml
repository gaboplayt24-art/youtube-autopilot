name: quality-test-free
on:
  workflow_dispatch:
    inputs:
      gemini_model:
        description: Optional eligible Free Tier model override (default gemini-3.8-flash)
        type: string
      gemini_free_tier_confirmed:
        description: Gemini project uses the Free Tier without paid API billing
        type: boolean
        default: false
      cloudflare_free_plan_confirmed:
        description: Account is on Workers Free, without paid overage billing
        type: boolean
        default: false
      run_id:
        type: string
        default: free-quality-test
      source_run_id:
        description: Actions run with the previous quality-test artifact, including quota pauses
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: free-provider-account
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      AUTO_PUBLISH: 'false'
      FREE_ONLY: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      MAX_PAID_COST_USD: '0'
      AI_VIDEO_ENABLED: 'false'
      MODEL_CACHE_DIR: ${{ github.workspace }}/.cache/models
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
      FREE_QUOTA_LEDGER_PATH: .cache/quota/free-quota-ledger.json
      CHROME_EXECUTABLE: /usr/bin/google-chrome
      RUN_ID: ${{ inputs.run_id || github.run_id }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ inputs.gemini_model || vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || (inputs.gemini_free_tier_confirmed && 'true' || '') }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_FREE_PLAN_CONFIRMED: ${{ vars.CLOUDFLARE_FREE_PLAN_CONFIRMED || (inputs.cloudflare_free_plan_confirmed && 'true' || '') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        id: models
        with:
          path: |
            .cache/models
            .cache/huggingface
          key: cpu-models-nano71ccd-depth5426-kokoro82-whispersmall-v3
          restore-keys: cpu-models-nano71ccd-depth5426-kokoro82-whispertiny-v1
      - uses: actions/cache@v4
        id: python-env
        with:
          path: |
            .venv-ai
            .cache/pip
          key: cpu-ai-ubuntu-${{ steps.python.outputs.python-version }}-${{ hashFiles('scripts/setup-cpu-ai.sh', 'scripts/requirements-cpu-ai.lock') }}
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/remotion
          key: remotion-linux-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: python scripts/restore-free-quota.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.source_run_id != ''
        with:
          name: quality-test-${{ env.RUN_ID }}
          path: data/runs/${{ env.RUN_ID }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Verify free-provider configuration before model installation
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$GEMINI_API_KEY" ] || [ "$CLOUDFLARE_FREE_PLAN_CONFIRMED" != true ] || [ "$GEMINI_FREE_TIER_CONFIRMED" != true ]; then
            npm run quality-test-free -- --run-id "$RUN_ID"
          fi
      - name: Prepare real script and visual bible before CPU installation
        timeout-minutes: 10
        run: npm run quality-test-free -- --run-id "$RUN_ID" --prepare
      - name: Install media tools
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo timeout 120s apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
            sudo timeout 120s apt-get install --no-install-recommends -y ffmpeg
          fi
      - name: Install CPU models environment
        if: steps.python-env.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: bash scripts/setup-cpu-ai.sh
      - run: ffmpeg -version && ffprobe -version && /usr/bin/google-chrome --version
      - run: npm run lint && npm run typecheck && npm test
      - name: Short real AI quality test, no upload or paid fallback
        timeout-minutes: 35
        run: npm run quality-test-free -- --run-id "$RUN_ID"
      - name: Verify encoded media
        run: ffprobe -v error -show_streams -show_format "data/runs/$RUN_ID/final.mp4"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-test-${{ env.RUN_ID }}
          path: data/runs/${{ env.RUN_ID }}/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-quota-ledger
          path: .cache/quota/free-quota-ledger.json
          include-hidden-files: true
          retention-days: 30
      - name: Retain downloaded public models after a failed quality gate
        if: always() && !cancelled() && steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/models
            .cache/huggingface
          key: cpu-models-nano71ccd-depth5426-kokoro82-whispersmall-v3
