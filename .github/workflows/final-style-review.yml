name: final-style-review
on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        default: final-style-review-001
      source_run_id:
        type: string
        default: '37867042030'
      resume_run_id:
        type: string
        description: Optional final-style checkpoint execution; never repeat returned repair
permissions:
  contents: read
  actions: read
concurrency:
  group: free-provider-account
  cancel-in-progress: false
jobs:
  milestone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_ID: ${{ inputs.run_id }}
      FREE_ONLY: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      MAX_PAID_COST_USD: '0'
      AUTO_PUBLISH: 'false'
      FREE_QUOTA_LEDGER_PATH: .cache/quota/free-quota-ledger.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 scripts/restore-free-quota.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: native-packaging-style-v4-3-real-001
          path: data/runs/${{ env.RUN_ID }}/prior
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.resume_run_id != ''
        with:
          name: final-style-${{ env.RUN_ID }}
          path: data/runs/${{ env.RUN_ID }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - run: bash scripts/ensure-media-ci.sh
        timeout-minutes: 5
      - run: npm run lint && npm run typecheck && npm test
      - name: One additional anatomy repair and final human-review preview
        id: style
        continue-on-error: true
        timeout-minutes: 18
        run: npx tsx src/visuals/final-style-review.ts --run-id "$RUN_ID" --prior "data/runs/$RUN_ID/prior"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || 'true' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_FREE_PLAN_CONFIRMED: ${{ vars.CLOUDFLARE_FREE_PLAN_CONFIRMED || 'true' }}
      - name: Preserve all real evidence, including rejection reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-style-${{ env.RUN_ID }}
          path: data/runs/${{ env.RUN_ID }}/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-quota-ledger
          path: .cache/quota/free-quota-ledger.json
          include-hidden-files: true
      - name: Objective defects block acceptance
        if: always()
        env:
          STYLE_RESULT: ${{ steps.style.outcome }}
        run: test "$STYLE_RESULT" = success
