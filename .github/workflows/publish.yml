name: publish
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Logical video run ID from create-video
        type: string
        required: true
      source_run_id:
        description: GitHub Actions ID of the create-video or previous private-upload run
        type: string
        required: true
      artifact_prefix:
        description: Artifact name prefix (production for production-validation runs, pipeline for create-video runs)
        type: string
        default: production
  # Called by production-validation after a fully QA-passed video (owner-authorized automatic private upload, 2026-10-10).
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true
      source_run_id:
        type: string
        required: true
      artifact_prefix:
        type: string
        default: production

permissions:
  contents: read
  actions: read
concurrency:
  group: publish-${{ inputs.run_id || github.run_id }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: youtube-private
    env:
      # Owner-authorized 2026-10-10: upload private and schedule publishAt for the next config/schedule.json slot.
      AUTO_PUBLISH: 'true'
      RUN_ID: ${{ inputs.run_id || github.run_id }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix || 'production' }}-${{ env.RUN_ID }}
          path: ${{ (inputs.artifact_prefix || 'production') == 'pipeline' && 'data/runs' || format('data/runs/{0}', env.RUN_ID) }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Private upload, scheduled publish (protected environment approval)
        run: npm run publish -- --run-id "$RUN_ID"
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upload-${{ env.RUN_ID }}
          path: data/runs/
          retention-days: 30
          if-no-files-found: warn
