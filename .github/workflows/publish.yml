name: publish
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Logical video run ID from create-video
        type: string
        required: true
      source_run_id:
        description: GitHub Actions ID of the create-video or previous private-upload run
        type: string
        required: true
      llm_provider:
        type: string
        default: gemini
      groq_free_plan_confirmed:
        type: boolean
        default: false
      owner_applies_thumbnail:
        type: boolean
        default: false
      owner_cover_confirmed:
        type: boolean
        default: false
      artifact_prefix:
        description: Artifact name prefix (production for production-validation runs, pipeline for create-video runs)
        type: string
        default: production
  # Called by production-validation after a fully QA-passed video (owner-authorized automatic private upload, 2026-10-10).
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true
      source_run_id:
        type: string
        required: true
      llm_provider:
        type: string
        default: gemini
      groq_free_plan_confirmed:
        type: boolean
        default: false
      owner_applies_thumbnail:
        type: boolean
        default: false
      owner_cover_confirmed:
        type: boolean
        default: false
      artifact_prefix:
        type: string
        default: production

permissions:
  contents: write
  actions: read
concurrency:
  group: publish-${{ inputs.run_id || github.run_id }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: youtube-private
    env:
      # Owner-authorized 2026-10-10: upload private and schedule publishAt for the next config/schedule.json slot.
      AUTO_PUBLISH: 'true'
      # Translations (owner-approved 2026-10-11) use the free Gemini tier through the shared quota ledger.
      FREE_ONLY: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      MAX_PAID_COST_USD: '0'
      FREE_QUOTA_LEDGER_PATH: .cache/quota/free-quota-ledger.json
      LLM_PROVIDER: ${{ inputs.llm_provider || 'gemini' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_FREE_PLAN_CONFIRMED: ${{ inputs.groq_free_plan_confirmed }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
      GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || 'true' }}
      RUN_ID: ${{ inputs.run_id || github.run_id }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 scripts/restore-free-quota.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Restore video from private release or legacy Actions artifact
        run: python3 scripts/github_checkpoints.py restore
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PREFIX: ${{ inputs.artifact_prefix || 'production' }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Private upload, scheduled publish (protected environment approval)
        run: npm run publish -- --run-id "$RUN_ID"
        env:
          OWNER_APPLIES_YOUTUBE_THUMBNAIL: ${{ inputs.owner_applies_thumbnail }}
          OWNER_COVER_CONFIRMED: ${{ inputs.owner_cover_confirmed }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      - name: Show titles and translations for the owner's Test & Compare and review
        if: always()
        run: |
          for f in titles.json localizations.json; do echo "== $f"; cat "data/runs/$RUN_ID/$f" 2>/dev/null || echo "(missing)"; echo; done
      - name: Preserve upload and scheduling evidence in private release
        if: always()
        run: python3 scripts/github_checkpoints.py save --publish-record-only
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Persist shared quota in private repository release
        if: always()
        run: |
          if [ -f scripts/github_checkpoints.py ]; then python3 scripts/github_checkpoints.py save-quota; fi
        env:
          GH_TOKEN: ${{ github.token }}
