name: resume-style-capacity
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: style-capacity-resume
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/resume-style-capacity.py
        env:
          GH_TOKEN: ${{ github.token }}
