name: voice-evidence-review
on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        required: true
        default: bible-angels-001
      source_run_id:
        description: Existing private release checkpoint, no new synthesis
        type: string
        required: true
      focus_part:
        type: string
        default: '2'
      clip_start:
        type: string
        default: '132.5'
      clip_end:
        type: string
        default: '138.5'
permissions:
  contents: write
  actions: read
jobs:
  export-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      FOCUS_PART: ${{ inputs.focus_part }}
      CLIP_START: ${{ inputs.clip_start }}
      CLIP_END: ${{ inputs.clip_end }}
      REVIEW_OUTPUT_DIR: .cache/voice-evidence-review
      AUTO_PUBLISH: 'false'
      FREE_ONLY: 'true'
      MAX_PAID_COST_USD: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - name: Verify private repository before reading or uploading media
        run: |
          python3 -c "import os,runpy; runpy.run_path('scripts/github_checkpoints.py')['require_private'](os.environ['GITHUB_REPOSITORY'])"
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Restore existing WAVs and raw ASR
        run: python3 scripts/github_checkpoints.py restore
      - name: Export evidence; this does not approve narration
        id: evidence
        run: npx tsx src/voice/evidence-review.ts
      - name: Store listening files in the private release; no Actions artifact quota
        env:
          ARCHIVE: ${{ steps.evidence.outputs.archive }}
          EXCERPT: ${{ steps.evidence.outputs.excerpt }}
          SUMMARY: ${{ steps.evidence.outputs.summary }}
          VOICE_STATUS: ${{ steps.evidence.outputs.voice_status }}
        run: |
          gh release upload "pipeline-checkpoint-$RUN_ID" "$ARCHIVE" "$EXCERPT" "$SUMMARY" --repo "$GITHUB_REPOSITORY"
          echo "Evidence export completed. Narration status: $VOICE_STATUS. This is not a passed production video." >> "$GITHUB_STEP_SUMMARY"
