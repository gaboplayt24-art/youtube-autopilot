name: free-first-smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Ensure FFmpeg without refreshing installed dependencies
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo timeout 120s apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
            sudo timeout 120s apt-get install --no-install-recommends -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - run: npm run free-first-smoke
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-first-smoke
          path: data/runs/free-first-smoke/
          retention-days: 30
