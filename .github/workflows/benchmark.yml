name: benchmark
on:
  workflow_dispatch:
    inputs:
      gemini_free_tier_confirmed:
        description: Optional Gemini recommendations using an eligible Free Tier project
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: free-provider-account
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FREE_ONLY: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      MAX_PAID_COST_USD: '0'
      FREE_QUOTA_LEDGER_PATH: .cache/quota/free-quota-ledger.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 scripts/restore-free-quota.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run benchmark
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          BENCHMARK_CHANNEL: ${{ vars.BENCHMARK_CHANNEL || '@ancientlivesHQ' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || (inputs.gemini_free_tier_confirmed && 'true' || '') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-report
          path: data/benchmarks/
          retention-days: 30
      - name: Persist shared quota in private repository release
        if: always()
        run: |
          if [ -f scripts/github_checkpoints.py ]; then python3 scripts/github_checkpoints.py save-quota; fi
        env:
          GH_TOKEN: ${{ github.token }}
