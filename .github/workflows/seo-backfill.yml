name: seo-backfill
# Owner-requested 2026-10-28: chapters, hashtags and search tags on published long videos, backed up and verified.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/seo-backfill.ts
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      - name: Preserve backups and results in a release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYSEO'
          import os, runpy, shutil
          from pathlib import Path
          store=runpy.run_path('scripts/github_checkpoints.py')
          repo=os.environ['GITHUB_REPOSITORY']; store['require_private'](repo)
          files=[p for p in Path('data/research/seo-backfill').glob('*.json')]
          if not files: raise SystemExit(0)
          tag='metadata-revisions-2026-10'; store['release'](repo,tag)
          dest=Path('.cache/seo-backfill'); dest.mkdir(parents=True,exist_ok=True)
          for path in files:
              target=dest/('seo-'+os.environ['GITHUB_RUN_ID']+'-'+path.name); shutil.copyfile(path,target); store['upload'](repo,tag,target)
          PYSEO
