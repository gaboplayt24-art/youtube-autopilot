name: resume-quality-quota
on:
  workflow_dispatch:
  schedule:
    - cron: '10 0 8 10 *'
permissions:
  contents: read
  actions: write
concurrency:
  group: approved-quality-quota-resume
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      AUTO_PUBLISH: 'false'
      FREE_ONLY: 'true'
      MAX_PAID_COST_USD: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - id: guard
        run: npx tsx scripts/resume-quality-quota.ts
      - uses: actions/download-artifact@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          name: quality-test-${{ steps.guard.outputs.run_id }}
          run-id: ${{ steps.guard.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: .cache/quality-reset
      - if: steps.guard.outputs.ready == 'true'
        run: npx tsx scripts/resume-quality-quota.ts --dispatch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-resume-status
          retention-days: 30
          path: |
            .cache/quality-reset/scheduler-status.json
            .cache/quality-reset/resume-dispatch.json
          if-no-files-found: warn
